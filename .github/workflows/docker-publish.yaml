name: "Docker Publish"
run-name: "Docker Build #${{ github.run_number }} (${{ github.event_name }})"

on:
  workflow_call:
  workflow_dispatch:

env:
  docker_image_name: "openclaw"

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v6
        with:
          ref: main

      - name: "Generate Image Tag"
        id: image_tag
        run: |
          image_tag=$(date "+%y.%j.%H%M%N") 
          echo "image_tag=$image_tag" >> "$GITHUB_ENV"
        shell: bash

      - name: "Log in to Docker Hub"
        uses: docker/login-action@v3
        with:
          username: ${{ vars.dockerhub_username }}
          password: ${{ secrets.dockerhub_pat }}

      - name: "Set up QEMU"
        uses: docker/setup-qemu-action@v3

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Build and push"
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: >
            ${{ vars.dockerhub_username }}/${{ env.docker_image_name }}:latest,
            ${{ vars.dockerhub_username }}/${{ env.docker_image_name }}:${{ env.image_tag }}
          build-args: |
            TAG=${{ env.image_tag }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.run_started_at }}
            OPENCLAW_INSTALL_BROWSER=1
          cache-from: type=registry,ref=${{ vars.dockerhub_username }}/${{ env.docker_image_name }}:buildcache
          cache-to: type=registry,ref=${{ vars.dockerhub_username }}/${{ env.docker_image_name }}:buildcache,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.run_started_at }}

      - name: "Verify pushed image"
        run: |
          # Take a beat to let the image push through to Docker Hub
          sleep 10
      
          # Verify tags exist
          docker manifest inspect ${{ vars.dockerhub_username }}/${{ env.docker_image_name }}:latest
          docker manifest inspect ${{ vars.dockerhub_username }}/${{ env.docker_image_name }}:${{ env.image_tag }}
      
          # Verify both architectures
          docker manifest inspect ${{ vars.dockerhub_username }}/${{ env.docker_image_name }}:latest | \
            jq -e '.manifests | length == 2'
      
          # Smoke test: pull and verify entrypoint exists
          docker pull --platform linux/amd64 ${{ vars.dockerhub_username }}/${{ env.docker_image_name }}:latest
          docker run --rm ${{ vars.dockerhub_username }}/${{ env.docker_image_name }}:latest --version
