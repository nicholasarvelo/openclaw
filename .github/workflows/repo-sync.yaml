name: "Repo Sync"
run-name: "Repo Sync #${{ github.run_number }} (${{ github.event_name }})"

on:
  schedule:
    - cron: '0 */6 * * *'

  workflow_dispatch:

env:
  source_repo: 'https://github.com/openclaw/openclaw.git'
  source_branch: 'main'
  target_branch: 'main'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          sparse-checkout: .
          token: ${{ secrets.PAT_RepoSync }}

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync with upstream
        run: |
          git remote add upstream ${{ env.source_repo }}
          git fetch upstream ${{ env.source_branch }}

          # Fast-forward only — no merge commit
          git merge --ff-only upstream/${{ env.source_branch }}
          git push origin ${{ env.target_branch }}
        shell: bash

  docker:
    needs: sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build and push Docker image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run docker-publish.yaml
